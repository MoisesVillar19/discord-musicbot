name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile bot.py config.py commands/*.py core/*.py music/*.py ui/*.py utils/*.py panel/*.py services/*.py
      - run: python -m ruff check bot.py config.py commands core music ui utils panel services tests
      - run: python -m ruff format --check bot.py config.py commands core music ui utils panel services tests
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report --fail-under=70

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
